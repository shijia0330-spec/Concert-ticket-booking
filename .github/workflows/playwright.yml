name: EventHub Playwright CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Create .env from GitHub Secrets
        env:
          COURSE_EMAIL: ${{ secrets.COURSE_EMAIL }}
          COURSE_PASSWORD: ${{ secrets.COURSE_PASSWORD }}
        run: |
          if [ -z "$COURSE_EMAIL" ] || [ -z "$COURSE_PASSWORD" ]; then
            echo "::error::Add repository secrets COURSE_EMAIL and COURSE_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # Strip CR/LF that sometimes get pasted into secrets
          COURSE_EMAIL=$(printf '%s' "$COURSE_EMAIL" | tr -d '\r\n')
          COURSE_PASSWORD=$(printf '%s' "$COURSE_PASSWORD" | tr -d '\r\n')
          {
            echo "COURSE_EMAIL=$COURSE_EMAIL"
            echo "COURSE_PASSWORD=$COURSE_PASSWORD"
            echo "BASE_URL=https://eventhub.rahulshettyacademy.com/login"
          } > .env

      - name: Run Playwright tests (headless)
        env:
          # Helpful on slow CI runners
          PWDEBUG: "0"
        run: |
          mkdir -p test-results
          pytest booking_system/test_cases -v --browser chromium \
            --tb=short \
            --screenshot=only-on-failure \
            --video=retain-on-failure \
            --tracing=retain-on-failure \
            --junitxml=test-results/junit.xml

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
